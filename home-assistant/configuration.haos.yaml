# Configuración HAOS VM (WayneLab) — fuente de verdad para /config/configuration.yaml
# Desplegar con infrastructure/voice/speaker-id/deploy_speaker_id_ha_config.sh
# o copiar por Samba a /Volumes/config
#
# Layout en HAOS (alineado con home-assistant/includes/ del repo):
#   /config/configuration.yaml   ← este archivo
#   /config/includes/*.yaml      ← home-assistant/includes/*.yaml (subcarpeta, no plano)
#   /config/secrets.yaml         ← NO se despliega (gitignored; se gestiona en HAOS)
#
# No incluir bloque http:: HA 2026.x lo ignora (repair) y se elimina en 2027.2.
# Proxy Caddy: Ajustes → Sistema → Red → Trust X-Forwarded-For + 192.168.1.55

# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  internal_url: http://192.168.1.110:8123
  # external_url: https://ha.waynehomelab.com  # VPN-only; set in UI or secrets
  allowlist_external_dirs:
    - /share/assist_pipeline
    - /share/speaker-id

# HA 2026.8+: HTTP / reverse proxy in Settings → System → Network
# Trust X-Forwarded-For + trusted_proxies: 192.168.1.55 (Caddy on WireGuard VM)
# See docs/wireguard.md

frontend:
  themes: !include_dir_merge_named themes

automation: !include includes/automations.yaml
script: !include includes/scripts.yaml
scene: !include includes/scenes.yaml
template: !include includes/sensors.yaml
input_text: !include includes/input_text.yaml
input_boolean: !include includes/input_boolean.yaml
light: !include includes/lights.yaml
rest_command: !include includes/rest_commands.yaml
shell_command: !include includes/shell_commands.yaml
intent_script: !include includes/intent_scripts.yaml

logger:
  default: warning
  # Diagnóstico Antela/Tuya (quitar tras depurar):
  # logs:
  #   homeassistant.components.tuya: debug
  #   custom_components.tuya_local: debug
  #   tinytuya: debug

recorder:
  purge_keep_days: 10
  commit_interval: 30
  exclude:
    entity_globs:
      - sensor.*_wi_fi_signal_strength
      - sensor.*rssi*
      - sensor.iphone_de_miguel_bssid
      - sensor.iphone_de_miguel_ssid
    event_types:
      - call_service

# Necesario para Speaker ID (folder watcher en /share/assist_pipeline).
# Purge de WAV en automations.yaml (15 min). No dejar logger de Assist en debug.
assist_pipeline:
  debug_recording_dir: /share/assist_pipeline
