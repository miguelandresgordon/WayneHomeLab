# Frases Assist (ES) — lámpara Xiaomi del salón.
# Pinadas a light.yeelink_mono6_6409_light para no colisionar con
# scene.lampara_apagada ni con luces del dormitorio / grupos.
# Destino HAOS: /config/custom_sentences/es/luces.yaml
language: "es"

intents:
  EnciendeLaLampara:
    data:
      - sentences:
          - "enciende [la] (lámpara|lampara)"
          - "enciende [la] (lámpara|lampara|luz) [del] (salón|salon)"
          - "enciende [la] luz"
          - "prende [la] (lámpara|lampara|luz)"
          - "prende [la] (lámpara|lampara|luz) [del] (salón|salon)"
          - "pon [la] (lámpara|lampara)"
          - "pon [la] (lámpara|lampara|luz) [del] (salón|salon)"
          - "activa [la] (lámpara|lampara)"
          - "enciende [las] luces"
          - "enciende [las] luces [del] (salón|salon)"
          # Verbo recortado/mal transcrito por Groq (F0, 2026-11-26)
          - "(entiende|conciende|enciendera|enciéndeme|enciendeme) [la] (lámpara|lampara)"

  ApagaLaLampara:
    data:
      - sentences:
          - "apaga [la] (lámpara|lampara)"
          - "apaga [la] (lámpara|lampara|luz) [del] (salón|salon)"
          - "apaga [la] luz"
          - "quita [la] (lámpara|lampara|luz)"
          - "quita [la] (lámpara|lampara|luz) [del] (salón|salon)"
          - "apaga [las] luces"
          - "apaga [las] luces [del] (salón|salon)"
          - "cierra [la] (lámpara|lampara)"
          # Verbo recortado/mal transcrito por Groq (F0, 2026-11-26)
          - "(apagada|apágala|apagala|apágame|apagame) [la] (lámpara|lampara)"

  # Brillo con verbo recortado («Con la lámpara al 50%»). Sin frase estricta,
  # el fuzzy matching de HA lo mandaba a PonRadioFavorita.
  LamparaBrillo:
    data:
      - sentences:
          - "<verbo_brillo> [el brillo de] [la] (lámpara|lampara) [del (salón|salon)] (al|a|el) {brillo}[%| por ciento]"
      - sentences:
          - "<verbo_brillo> [el brillo de] [la] (lámpara|lampara) [del (salón|salon)] (al|a|el) (mínimo|minimo)"
        slots:
          brillo: 1
      - sentences:
          - "<verbo_brillo> [el brillo de] [la] (lámpara|lampara) [del (salón|salon)] (al|a|el) (máximo|maximo)"
        slots:
          brillo: 100

  ToggleLaLampara:
    data:
      - sentences:
          - "cambia [la] (lámpara|lampara)"
          - "cambia [la] (lámpara|lampara|luz) [del] (salón|salon)"
          - "alterna [la] (lámpara|lampara)"
          - "conmuta [la] (lámpara|lampara)"
          - "toggle [la] (lámpara|lampara)"

expansion_rules:
  verbo_brillo: "(pon|ponme|ponla|con|o)"

lists:
  brillo:
    range:
      from: 1
      to: 100
