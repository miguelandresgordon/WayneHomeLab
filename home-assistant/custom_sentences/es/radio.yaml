# Frases Assist (ES) — radio en Satellite1
# Destino HAOS: /config/custom_sentences/es/radio.yaml
#
# Variantes reales de Groq (F0, 2026-11-26): tras el wake word se recorta el
# «Pon» inicial y llega «Con la SER», «Hola SER», «O la cadena SER»,
# «¡Von la SER!», «Ponla SER», «Hola, Cadena Cero». Se aceptan como verbo.
# Tests: tests/assist/test_radio_sentences.py
language: "es"

expansion_rules:
  # Verbo de «poner la radio», incluidas las formas recortadas por el STT.
  poner: "(pon|ponme|ponla|pone|von|con|o|hola|sintoniza|sintonízame|sintonizame|reproduce|escucha|enciende|quiero (oír|oir|escuchar)|me pones|puedes poner)"
  parar: "(para|apaga|quita|stop|detén|deten|corta)"
  cortesia: "[por favor]"

intents:
  PonRadioFavorita:
    data:
      - sentences:
          - "<poner> [la] radio <cortesia>"
        slots:
          emisora: ser
      - sentences:
          - "<poner> [la] [radio] {emisora} [en la radio] <cortesia>"
          - "ponme a {emisora}"
          # Solo el nombre (el STT se comió el verbo entero): «la ser».
          - "[la] {emisora}"

  ParaRadioFavorita:
    data:
      - sentences:
          - "<parar> [la] radio"
          - "<parar> [la] {emisora}"
          - "(silencia|silencio) [la] radio"
          - "para de (escuchar|reproducir) [la radio]"
          - "deja de (escuchar|reproducir) [la radio]"

  # Cualquier emisora que no esté en la lista cerrada "emisora" de arriba
  # (p.ej. BBC, Cadena 100...) cae aquí y se busca por nombre en Radio Browser.
  PonRadioBrowser:
    data:
      - sentences:
          - "pon [la] radio {consulta}"
          - "ponme [la] radio {consulta}"
          - "reproduce [la] radio {consulta}"
          - "quiero [escuchar] [la] radio {consulta}"
          - "escucha [la] radio {consulta}"
          - "busca [y pon] [la] radio {consulta}"

  # Emisora al azar de todo el mundo, vía Radio Browser.
  PonRadioAleatoria:
    data:
      - sentences:
          - "pon [una] radio aleatoria"
          - "ponme [una] radio aleatoria"
          - "pon [una] radio al azar"
          - "ponme [una] radio al azar"
          - "pon [una] radio del mundo"
          - "ponme [una] radio del mundo"
          - "pon [una] radio random"
          - "sorpréndeme [con una radio]"

  # Listas de Radio Browser: populares, locales, por país, idioma o género.
  PonRadioLista:
    data:
      - sentences:
          - "pon [las] radios {criterio}"
          - "pon [una] radio {criterio}"
          - "ponme [una] radio {criterio}"
          - "quiero [escuchar] [una] radio {criterio}"

lists:
  # Nombre libre para Radio Browser (PonRadioBrowser). Sin esta lista HA
  # respondía «Unknown error» a «pon la radio BBC» (2026-11-26).
  consulta:
    wildcard: true

  emisora:
    values:
      - in: "ser"
        out: "ser"
      - in: "cadena cero"
        out: "ser"
      - in: "ser madrid"
        out: "ser"
      - in: "la ser"
        out: "ser"
      - in: "cadena ser"
        out: "ser"
      - in: "la cadena ser"
        out: "ser"
      - in: "radio madrid"
        out: "ser"
      - in: "radiovoz"
        out: "radiovoz"
      - in: "radio voz"
        out: "radiovoz"
      - in: "radiovoz lugo"
        out: "radiovoz"
      - in: "radio voz lugo"
        out: "radiovoz"
      - in: "filispim"
        out: "filispim"
      - in: "filispín"
        out: "filispim"
      - in: "radio filispim"
        out: "filispim"
      - in: "radio filispín"
        out: "filispim"
      - in: "almenara"
        out: "almenara"
      - in: "radio almenara"
        out: "almenara"
      - in: "radio 3"
        out: "radio3"
      - in: "radio tres"
        out: "radio3"
      - in: "radio3"
        out: "radio3"
      - in: "rne"
        out: "radio3"
      - in: "rne radio 3"
        out: "radio3"
      - in: "radio 3 de rne"
        out: "radio3"
      - in: "roncudo"
        out: "roncudo"
      - in: "radio roncudo"
        out: "roncudo"

  # Codifica "modo:valor" para script.poner_radio_browser (ver intent_scripts.yaml).
  criterio:
    values:
      - in: "populares"
        out: "popular:"
      - in: "las populares"
        out: "popular:"
      - in: "más populares"
        out: "popular:"
      - in: "local"
        out: "local:"
      - in: "locales"
        out: "local:"
      - in: "de aquí"
        out: "local:"
      - in: "de españa"
        out: "country:ES"
      - in: "española"
        out: "country:ES"
      - in: "españolas"
        out: "country:ES"
      - in: "de jazz"
        out: "tag:jazz"
      - in: "jazz"
        out: "tag:jazz"
      - in: "de noticias"
        out: "tag:news"
      - in: "de rock"
        out: "tag:rock"
      - in: "de pop"
        out: "tag:pop"
      - in: "de música clásica"
        out: "tag:classical"
      - in: "clásica"
        out: "tag:classical"
      - in: "de fútbol"
        out: "tag:sport"
      - in: "de deportes"
        out: "tag:sport"
      - in: "de conversación"
        out: "tag:talk"
      - in: "en español"
        out: "language:spanish"
      - in: "en inglés"
        out: "language:english"
      - in: "en gallego"
        out: "language:galician"
      - in: "en francés"
        out: "language:french"
      - in: "en alemán"
        out: "language:german"
