# Frases Assist (ES) — TV del salón = Google Streamer (TV GA).
# Entidad: media_player.tv_ga_2 (androidtv_remote). No usar la Sony Bravia ni Cast.
# Destino HAOS: /config/custom_sentences/es/tv.yaml
language: "es"

intents:
  ApagaLaTele:
    data:
      - sentences:
          - "apaga [la] (tele|televisión|television|tv)"
          - "apaga [el] (televisor|tv|chromecast)"
          - "apaga [el] (google streamer|streamer)"
          - "apaga [la] tv ga"
          - "cierra [la] (tele|televisión|television|tv)"
          - "para [la] (tele|televisión|television|tv)"
          - "quita [la] (tele|televisión|television|tv)"

