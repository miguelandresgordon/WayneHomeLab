# ==============================================================================
# Home Assistant — Automations (canónico WayneHomeLab)
#
# Solo voz / Satellite1 / Speaker ID. Sin rutinas de hábitos (noche, cine,
# presencia): se diseñarán cuando el pipeline esté estable.
# Groq es el STT; no arrancar core_whisper.
# Desplegar: infrastructure/voice/wake-word/deploy_ha_voice_config.sh
# ==============================================================================

# ------------------------------------------------------------------------------
# Speaker ID — identificar hablante tras cada comando de voz
# Requiere: add-on speaker-id-mariano + assist_pipeline.debug_recording_dir
# ------------------------------------------------------------------------------
- id: speaker_id_on_command
  alias: "Speaker ID — identificar hablante"
  description: "Identifica quién habló tras grabar WAV en /share/assist_pipeline"
  trigger:
    - platform: event
      event_type: folder_watcher
  condition:
    - condition: template
      value_template: >-
        {{ trigger.event.data.path is defined
           and trigger.event.data.path.endswith('.wav')
           and trigger.event.data.event_type in ['closed', 'moved', 'created'] }}
  action:
    - delay: "00:00:01"
    - variables:
        wav_path: "{{ trigger.event.data.path }}"
    - service: rest_command.identify_speaker
      data:
        path: "{{ wav_path }}"
      response_variable: speaker_result
    - service: input_text.set_value
      target:
        entity_id: input_text.current_speaker
      data:
        value: "{{ speaker_result.content.person | default('desconocido') }}"
    - event: speaker_identified
      event_data:
        person: "{{ speaker_result.content.person | default('desconocido') }}"
        score: "{{ speaker_result.content.score | default(0) }}"
        is_known: "{{ speaker_result.content.is_known | default(false) }}"
        wav_path: "{{ wav_path }}"
  mode: queued
  max: 5

- id: speaker_id_purge_wavs
  alias: "Speaker ID — purgar WAV antiguos"
  description: "Elimina grabaciones de debug de más de 24 h y deja como máximo 30 WAV"
  trigger:
    - platform: time_pattern
      minutes: 0
  action:
    - service: shell_command.speaker_id_purge_old_wavs
  mode: single

# ------------------------------------------------------------------------------
# Satellite1 — guardia TV (falsos wakes) sin mute permanente
# Entidades reales: tv_ga_2 + Bravia IP, switch mute_microphones.
# Con TV on: cutoff estricto (Slightly). Mute solo tras 8 min de playing
# sin comando. Unmute: botón Action largo, o TV parada 5 min.
# ------------------------------------------------------------------------------
- id: satellite1_tv_strict_sensitivity
  alias: "Satellite1 — sensibilidad estricta con TV"
  description: "Sube el cutoff de Mariano (Slightly sensitive) al poner la tele. No mutea."
  trigger:
    - platform: state
      entity_id:
        - media_player.tv_ga_2
        - media_player.bravia_kd_43xf8596
      to:
        - playing
        - "on"
      not_from:
        - unavailable
        - unknown
  action:
    - service: select.select_option
      target:
        entity_id: select.satellite1_c7ffe4_wake_word_sensitivity
      data:
        option: Slightly sensitive
      continue_on_error: true
  mode: single

- id: satellite1_mute_tv_playing
  alias: "Satellite1 — mute TV tras inactividad de voz"
  description: >-
    Mutea mute_microphones solo si tv_ga_2 o la Bravia llevan 8 min en playing
    sin un comando (listening). Unmute: botón Action largo.
  trigger:
    - platform: state
      entity_id:
        - media_player.tv_ga_2
        - media_player.bravia_kd_43xf8596
      to: playing
    - platform: state
      entity_id: assist_satellite.satellite1_c7ffe4_satelite_assist
      to: listening
    - platform: state
      entity_id: switch.satellite1_c7ffe4_mute_microphones
      to: "off"
  condition:
    - condition: template
      value_template: >-
        {{ states('media_player.tv_ga_2') == 'playing'
           or states('media_player.bravia_kd_43xf8596') == 'playing' }}
  action:
    - delay: "00:08:00"
    - condition: template
      value_template: >-
        {{ states('media_player.tv_ga_2') == 'playing'
           or states('media_player.bravia_kd_43xf8596') == 'playing' }}
    - service: switch.turn_on
      target:
        entity_id: switch.satellite1_c7ffe4_mute_microphones
      continue_on_error: true
  mode: restart

- id: satellite1_unmute_tv_stopped
  alias: "Satellite1 — unmute TV parada"
  description: "Reactiva el mic y restaura Moderately sensitive cuando la TV lleva 5 min parada"
  trigger:
    - platform: state
      entity_id:
        - media_player.tv_ga_2
        - media_player.bravia_kd_43xf8596
      to:
        - idle
        - paused
        - "off"
        - standby
      for: "00:05:00"
  condition:
    - condition: template
      value_template: >-
        {{ states('media_player.tv_ga_2') not in ['playing', 'on']
           and states('media_player.bravia_kd_43xf8596') not in ['playing', 'on'] }}
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.satellite1_c7ffe4_mute_microphones
      continue_on_error: true
    - service: select.select_option
      target:
        entity_id: select.satellite1_c7ffe4_wake_word_sensitivity
      data:
        option: Moderately sensitive
      continue_on_error: true
  mode: single

# ------------------------------------------------------------------------------
# Satellite1 — botón Action y volumen
# ------------------------------------------------------------------------------
- id: satellite1_action_button
  alias: "Satellite1 — botón Action"
  description: "1 clic lámpara, largo mute mic"
  trigger:
    - platform: state
      entity_id: event.satellite1_c7ffe4_action_button_press
      not_from:
        - unavailable
        - unknown
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.attributes.event_type == 'single_press' }}"
          sequence:
            - service: light.toggle
              target:
                entity_id: light.yeelink_mono6_6409_light
              continue_on_error: true
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.attributes.event_type == 'long_press' }}"
          sequence:
            - service: switch.toggle
              target:
                entity_id: switch.satellite1_c7ffe4_mute_microphones
              continue_on_error: true
  mode: queued
  max: 5

- id: satellite1_vol_up
  alias: "Satellite1 — volumen +"
  trigger:
    - platform: state
      entity_id: binary_sensor.satellite1_c7ffe4_button_up_vol
      to: "on"
      not_from:
        - unavailable
        - unknown
  action:
    - service: media_player.volume_up
      target:
        entity_id: media_player.satellite1_c7ffe4_media_player
      continue_on_error: true
  mode: queued
  max: 10

- id: satellite1_vol_down
  alias: "Satellite1 — volumen −"
  trigger:
    - platform: state
      entity_id: binary_sensor.satellite1_c7ffe4_button_down_vol
      to: "on"
      not_from:
        - unavailable
        - unknown
  action:
    - service: media_player.volume_down
      target:
        entity_id: media_player.satellite1_c7ffe4_media_player
      continue_on_error: true
  mode: queued
  max: 10

# Conversation triggers de radio (complementa custom_sentences/es/radio.yaml).
- id: voz_radio_favorita
  alias: "Voz — poner o parar radio"
  description: "Assist: pon/para emisoras en Satellite1"
  trigger:
    - platform: conversation
      id: ser
      command:
        - "pon [la] radio"
        - "ponme [la] radio"
        - "reproduce [la] radio"
        - "pon [la] ser"
        - "ponme [la] ser"
        - "pon [la] cadena ser"
        - "pon radio madrid"
        - "pon la radio madrid"
    - platform: conversation
      id: radiovoz
      command:
        - "pon [la] radiovoz"
        - "ponme [la] radiovoz"
        - "pon radio voz"
        - "pon radiovoz lugo"
        - "pon radio voz lugo"
        - "pon la radio voz"
    - platform: conversation
      id: filispim
      command:
        - "pon [la] filispim"
        - "ponme [la] filispim"
        - "pon [la] filispín"
        - "pon radio filispim"
        - "pon radio filispín"
        - "pon la radio filispim"
    - platform: conversation
      id: almenara
      command:
        - "pon [la] almenara"
        - "ponme [la] almenara"
        - "pon radio almenara"
        - "pon la radio almenara"
    - platform: conversation
      id: radio3
      command:
        - "pon radio 3"
        - "pon radio tres"
        - "pon radio3"
        - "pon la radio 3"
        - "pon la radio tres"
        - "pon [la] erre ene tres"
        - "pon rne"
        - "pon rne radio 3"
    - platform: conversation
      id: roncudo
      command:
        - "pon [la] roncudo"
        - "pon radio roncudo"
        - "pon la radio roncudo"
    - platform: conversation
      id: parar
      command:
        - "para [la] radio"
        - "apaga [la] radio"
        - "quita [la] radio"
        - "para de (escuchar|reproducir) [la radio]"
        - "deja de (escuchar|reproducir) [la radio]"
        - "stop [la] radio"
        - "para de escuchar"
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'parar' }}"
          sequence:
            - service: script.parar_radio
            - set_conversation_response: "Paro la radio."
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'roncudo' }}"
          sequence:
            - set_conversation_response: >-
                Radio Roncudo solo emite en FM 106.1; no hay stream online.
      default:
        - service: script.poner_radio
          data:
            emisora: "{{ trigger.id }}"
        - set_conversation_response: >-
            {% set names = {
              'ser': 'Cadena SER',
              'radiovoz': 'RadioVoz Lugo',
              'filispim': 'Radio Filispim',
              'almenara': 'Radio Almenara',
              'radio3': 'Radio 3'
            } %}Pongo {{ names.get(trigger.id, 'la radio') }}.
  mode: queued
  max: 5

- id: satellite1_wake_word_mariano
  alias: "Satellite1 — restaurar estado de voz"
  description: >-
    Al arrancar HA o volver el satélite de unavailable: Mariano, VAD relaxed,
    unmute y sensibilidad según TV.
  trigger:
    - platform: homeassistant
      event: start
    - platform: state
      entity_id: select.satellite1_c7ffe4_palabra_de_activacion
      from: unavailable
    - platform: state
      entity_id: assist_satellite.satellite1_c7ffe4_satelite_assist
      from: unavailable
    - platform: state
      entity_id: switch.satellite1_c7ffe4_mute_microphones
      from: unavailable
  action:
    - wait_template: >-
        {{ 'Mariano' in (state_attr('select.satellite1_c7ffe4_palabra_de_activacion', 'options') or []) }}
      timeout: "00:02:00"
    - service: select.select_option
      target:
        entity_id: select.satellite1_c7ffe4_palabra_de_activacion
      data:
        option: Mariano
      continue_on_error: true
    - wait_template: >-
        {{ states('select.satellite1_c7ffe4_deteccion_de_fin_de_habla') not in ['unavailable', 'unknown', ''] }}
      timeout: "00:01:00"
    - service: select.select_option
      target:
        entity_id: select.satellite1_c7ffe4_deteccion_de_fin_de_habla
      data:
        option: relaxed
      continue_on_error: true
    - service: switch.turn_off
      target:
        entity_id: switch.satellite1_c7ffe4_mute_microphones
      continue_on_error: true
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ states('media_player.tv_ga_2') in ['playing', 'on']
                   or states('media_player.bravia_kd_43xf8596') in ['playing', 'on'] }}
          sequence:
            - service: select.select_option
              target:
                entity_id: select.satellite1_c7ffe4_wake_word_sensitivity
              data:
                option: Slightly sensitive
              continue_on_error: true
      default:
        - service: select.select_option
          target:
            entity_id: select.satellite1_c7ffe4_wake_word_sensitivity
          data:
            option: Moderately sensitive
          continue_on_error: true
  mode: restart

- id: satellite1_last_stt_text
  alias: "Satellite1 — guardar última transcripción"
  description: "Copia el texto STT (evento ESPHome on_stt_end) a input_text.last_stt_text"
  trigger:
    - platform: event
      event_type: esphome.satellite1_stt_end
  condition:
    - condition: template
      value_template: "{{ (trigger.event.data['text'] | default('')) | length > 0 }}"
  action:
    - service: input_text.set_value
      target:
        entity_id: input_text.last_stt_text
      data:
        value: "{{ trigger.event.data.text[:255] }}"
  mode: queued
  max: 5
