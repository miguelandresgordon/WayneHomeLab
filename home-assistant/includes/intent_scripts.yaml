# Acciones Assist (intent_script). Destino HAOS: /config/intent_scripts.yaml
# Frases: custom_sentences/es/{luces,radio,tv,tv_entradas}.yaml

# Lámpara Xiaomi del salón — nunca scene.lampara_apagada ni otras luces.
EnciendeLaLampara:
  description: Enciende la lámpara Xiaomi del salón
  action:
    - action: light.turn_on
      target:
        entity_id: light.yeelink_mono6_6409_light
      continue_on_error: true
  speech:
    text: "Enciendo la lámpara."

ApagaLaLampara:
  description: Apaga la lámpara Xiaomi del salón
  action:
    - action: light.turn_off
      target:
        entity_id: light.yeelink_mono6_6409_light
      continue_on_error: true
  speech:
    text: "Apago la lámpara."

ToggleLaLampara:
  description: Alterna la lámpara Xiaomi del salón
  action:
    - action: light.toggle
      target:
        entity_id: light.yeelink_mono6_6409_light
      continue_on_error: true
  speech:
    text: "Cambio la lámpara."

# Brillo con verbo recortado por el STT («Con la lámpara al 50%»).
# Frases: custom_sentences/es/luces.yaml (LamparaBrillo)
LamparaBrillo:
  description: Ajusta el brillo de la lámpara Xiaomi del salón
  action:
    - action: light.turn_on
      target:
        entity_id: light.yeelink_mono6_6409_light
      data:
        brightness_pct: "{{ brillo | int(50) }}"
      continue_on_error: true
  speech:
    text: "Lámpara al {{ brillo | int(50) }} por ciento."

PonRadioFavorita:
  description: Reproduce una emisora favorita en Satellite1
  action:
    - action: script.poner_radio
      data:
        emisora: "{{ emisora | default('ser') }}"
  speech:
    text: >-
      {% set key = (emisora | default('ser') | lower | trim) %}
      {% set names = {
        'ser': 'Cadena SER',
        'radiovoz': 'RadioVoz Lugo',
        'filispim': 'Radio Filispim',
        'almenara': 'Radio Almenara',
        'radio3': 'Radio 3',
        'roncudo': 'Radio Roncudo'
      } %}
      {% if key == 'roncudo' %}
        Radio Roncudo solo emite en FM 106.1; no hay stream online disponible.
      {% else %}
        Pongo {{ names.get(key, 'Cadena SER') }}.
      {% endif %}

ParaRadioFavorita:
  description: Detiene la radio en Satellite1
  action:
    - action: script.parar_radio
  speech:
    text: "Paro la radio."

# Cualquier emisora del mundo, aleatoria o por categoría, vía Radio Browser.
# Frases: custom_sentences/es/radio.yaml (PonRadioBrowser, PonRadioAleatoria, PonRadioLista)
PonRadioBrowser:
  description: Busca y reproduce cualquier emisora vía Radio Browser
  action:
    - action: script.poner_radio_browser
      data:
        modo: byname
        consulta: "{{ consulta }}"
      response_variable: rb_result
    # intent_script solo pasa a speech lo que devuelve la acción
    - stop: ""
      response_variable: rb_result
  speech:
    text: >-
      {% if action_response.encontrada %}
        Pongo {{ action_response.nombre }}.
      {% else %}
        No he encontrado ninguna emisora llamada {{ consulta }}.
      {% endif %}

PonRadioAleatoria:
  description: Reproduce una emisora aleatoria de todo el mundo vía Radio Browser
  action:
    - action: script.poner_radio_browser
      data:
        modo: random
      response_variable: rb_result
    # intent_script solo pasa a speech lo que devuelve la acción
    - stop: ""
      response_variable: rb_result
  speech:
    text: >-
      {% if action_response.encontrada %}
        Pongo {{ action_response.nombre }}. Una radio al azar de todo el mundo.
      {% else %}
        No he podido encontrar una radio aleatoria ahora mismo.
      {% endif %}

PonRadioLista:
  description: Reproduce una emisora de Radio Browser por categoría (populares, locales, país, idioma o género)
  action:
    - action: script.poner_radio_browser
      data:
        modo: "{{ criterio.split(':')[0] }}"
        consulta: "{{ criterio.split(':')[1] if ':' in criterio else '' }}"
      response_variable: rb_result
    # intent_script solo pasa a speech lo que devuelve la acción
    - stop: ""
      response_variable: rb_result
  speech:
    text: >-
      {% if action_response.encontrada %}
        Pongo {{ action_response.nombre }}.
      {% else %}
        No he encontrado ninguna emisora para esa categoría.
      {% endif %}

# TV del salón: siempre Google Streamer (media_player.tv_ga_2).
ApagaLaTele:
  description: Apaga el Google Streamer (TV GA)
  action:
    - action: media_player.turn_off
      target:
        entity_id: media_player.tv_ga_2
      continue_on_error: true
  speech:
    text: "Apago la tele."

EnciendeLaTele:
  description: Enciende el Google Streamer (TV GA)
  action:
    - action: media_player.turn_on
      target:
        entity_id: media_player.tv_ga_2
      continue_on_error: true
  speech:
    text: "Enciendo la tele."

SubeVolumenTele:
  description: Sube el volumen del Google Streamer
  action:
    - action: media_player.volume_up
      target:
        entity_id: media_player.tv_ga_2
      continue_on_error: true
  speech:
    text: "Subo el volumen."

BajaVolumenTele:
  description: Baja el volumen del Google Streamer
  action:
    - action: media_player.volume_down
      target:
        entity_id: media_player.tv_ga_2
      continue_on_error: true
  speech:
    text: "Bajo el volumen."

SilenciaLaTele:
  description: Silencia el Google Streamer
  action:
    - action: media_player.volume_mute
      target:
        entity_id: media_player.tv_ga_2
      data:
        is_volume_muted: true
      continue_on_error: true
  speech:
    text: "Silencio la tele."

QuitaSilencioTele:
  description: Quita el silencio del Google Streamer
  action:
    - action: media_player.volume_mute
      target:
        entity_id: media_player.tv_ga_2
      data:
        is_volume_muted: false
      continue_on_error: true
  speech:
    text: "Quito el silencio."

PausaLaTele:
  description: Pausa el Google Streamer
  action:
    - action: media_player.media_pause
      target:
        entity_id: media_player.tv_ga_2
      continue_on_error: true
  speech:
    text: "Pauso la tele."

ReanudaLaTele:
  description: Reanuda el Google Streamer
  action:
    - action: media_player.media_play
      target:
        entity_id: media_player.tv_ga_2
      continue_on_error: true
  speech:
    text: "Sigo la tele."

# Cambio de entrada (HDMI, PlayStation, Streamer...) — solo lo soporta la Sony
# Bravia real (media_player.bravia_kd_43xf8596, integración braviatv).
# Frases: custom_sentences/es/tv_entradas.yaml
CambiaEntradaTele:
  description: Cambia la entrada/fuente de la Sony Bravia real
  action:
    - action: script.poner_entrada_tele
      data:
        entrada: "{{ entrada_tv }}"
  speech:
    text: "Pongo {{ entrada_tv }} en la tele."

# Alucinaciones de Whisper (silencio/TV): no hacer nada y no hablar.
# Frases: custom_sentences/es/ruido.yaml
IgnorarRuido:
  description: Ignora alucinaciones típicas del STT

# ---------------------------------------------------------------------------
# Spotify vía Music Assistant (F2). Frases: custom_sentences/es/musica.yaml
# Reproduce en media_player.satellite1 (MA) y confirma qué ha puesto.
# ---------------------------------------------------------------------------
MusicaCancion:
  description: Pone una canción (búsqueda difusa en Spotify)
  action:
    - action: script.musica_buscar_y_poner
      data:
        tipo: track
        nombre: "{{ nombre | default('') }}"
        artista: "{{ artista | default('') }}"
      response_variable: r
    # intent_script solo pasa a speech lo que devuelve la acción
    - stop: ""
      response_variable: r
  speech:
    text: >-
      {% if action_response.encontrado %}Pongo {{ action_response.nombre }}{% if action_response.artista %}, de {{ action_response.artista }}{% endif %}.
      {% else %}No he encontrado {{ nombre | default(artista) }}.{% endif %}

MusicaDisco:
  description: Pone un disco
  action:
    - action: script.musica_buscar_y_poner
      data:
        tipo: album
        nombre: "{{ nombre | default('') }}"
      response_variable: r
    # intent_script solo pasa a speech lo que devuelve la acción
    - stop: ""
      response_variable: r
  speech:
    text: >-
      {% if action_response.encontrado %}Pongo el disco {{ action_response.nombre }}{% if action_response.artista %}, de {{ action_response.artista }}{% endif %}.
      {% else %}No he encontrado el disco {{ nombre }}.{% endif %}

MusicaPlaylist:
  description: Pone una playlist (primero las tuyas)
  action:
    - action: script.musica_buscar_y_poner
      data:
        tipo: playlist
        nombre: "{{ nombre | default('') }}"
      response_variable: r
    # intent_script solo pasa a speech lo que devuelve la acción
    - stop: ""
      response_variable: r
  speech:
    text: >-
      {% if action_response.encontrado %}Pongo la playlist {{ action_response.nombre }}.
      {% else %}No he encontrado la playlist {{ nombre }}.{% endif %}

MusicaArtista:
  description: Pone música de un artista
  action:
    - action: script.musica_buscar_y_poner
      data:
        tipo: artist
        nombre: "{{ artista | default('') }}"
      response_variable: r
    # intent_script solo pasa a speech lo que devuelve la acción
    - stop: ""
      response_variable: r
  speech:
    text: >-
      {% if action_response.encontrado %}Pongo música de {{ action_response.nombre }}.
      {% else %}No he encontrado a {{ artista }}.{% endif %}

MusicaSiguiente:
  description: Siguiente canción
  action:
    - action: media_player.media_next_track
      target:
        entity_id: media_player.satellite1
      continue_on_error: true
  speech:
    text: ""

MusicaAnterior:
  description: Canción anterior
  action:
    - action: media_player.media_previous_track
      target:
        entity_id: media_player.satellite1
      continue_on_error: true
  speech:
    text: ""

MusicaPausa:
  description: Pausa la música
  action:
    - action: media_player.media_pause
      target:
        entity_id: media_player.satellite1
      continue_on_error: true
  speech:
    text: ""

MusicaSigue:
  description: Reanuda la música
  action:
    - action: media_player.media_play
      target:
        entity_id: media_player.satellite1
      continue_on_error: true
  speech:
    text: ""

# Volumen del altavoz del Satellite1 (afecta a radio, música y voz).
VolumenSube:
  description: Sube 10 puntos el volumen del Satellite1
  action:
    - action: media_player.volume_set
      target:
        entity_id: media_player.satellite1_c7ffe4_media_player
      data:
        volume_level: "{{ [1.0, (state_attr('media_player.satellite1_c7ffe4_media_player', 'volume_level') | float(0.5)) + 0.1] | min | round(2) }}"
      continue_on_error: true
  speech:
    text: ""

VolumenBaja:
  description: Baja 10 puntos el volumen del Satellite1
  action:
    - action: media_player.volume_set
      target:
        entity_id: media_player.satellite1_c7ffe4_media_player
      data:
        volume_level: "{{ [0.05, (state_attr('media_player.satellite1_c7ffe4_media_player', 'volume_level') | float(0.5)) - 0.1] | max | round(2) }}"
      continue_on_error: true
  speech:
    text: ""

VolumenPon:
  description: Fija el volumen del Satellite1
  action:
    - action: media_player.volume_set
      target:
        entity_id: media_player.satellite1_c7ffe4_media_player
      data:
        volume_level: "{{ ([5, nivel | int(50), 100] | sort)[1] / 100 }}"
      continue_on_error: true
  speech:
    text: "Volumen al {{ nivel }}."

MusicaQueSuena:
  description: Dice qué está sonando en Music Assistant
  speech:
    text: >-
      {% set t = state_attr('media_player.satellite1', 'media_title') %}
      {% set a = state_attr('media_player.satellite1', 'media_artist') %}
      {% if is_state('media_player.satellite1', 'playing') and t %}Suena {{ t }}{% if a %}, de {{ a }}{% endif %}.
      {% else %}Ahora no está sonando nada.{% endif %}
