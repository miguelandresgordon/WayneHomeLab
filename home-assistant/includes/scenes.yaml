# Escenas explícitas (no snapshots de UI). Nombres que no coinciden con áreas.
# Solo salón / Xiaomi. Antela (dormitorio) se puede añadir a escenas cuando
# exista entidad estable vía Tuya Local (ver lights.yaml).
- id: relajado
  name: Relajado
  icon: mdi:weather-sunset
  entities:
    light.yeelink_mono6_6409_light:
      state: "on"
      brightness: 89

- id: lectura
  name: Lectura
  icon: mdi:book-open-page-variant
  entities:
    light.yeelink_mono6_6409_light:
      state: "on"
      brightness: 204

- id: cine
  name: Cine
  icon: mdi:movie-open
  entities:
    light.yeelink_mono6_6409_light:
      state: "on"
      brightness: 20

# Nombre sin «Lámpara»: HassTurnOn no debe colisionar con la luz Xiaomi.
# No exponer a Assist (configure_ha_voice_nlu.sh).
- id: lampara_apagada
  name: Salón off
  icon: mdi:lightbulb-off
  entities:
    light.yeelink_mono6_6409_light:
      state: "off"
