# Scripts de voz (radio / tele). Sin rutinas de hábitos (noche, cine, presencia).
# Entity IDs reales de la instancia HAOS (2026.8). Antela aún no está en HA.

poner_radio:
  alias: Poner radio
  description: Reproduce una emisora favorita en el Satellite1
  icon: mdi:radio
  mode: restart
  fields:
    emisora:
      name: Emisora
      description: Clave (ser, radiovoz, filispim, almenara, radio3, roncudo)
      example: ser
      required: false
      default: ser
      selector:
        select:
          options:
            - ser
            - radiovoz
            - filispim
            - almenara
            - radio3
            - roncudo
  sequence:
    - variables:
        key: "{{ (emisora | default('ser') | lower | trim) }}"
        stream_url: >-
          {% set stations = {
            'ser': 'https://playerservices.streamtheworld.com/api/livestream-redirect/SER_MADRID.mp3',
            'radiovoz': 'https://live.radiovoz.es/mp3/stream_lugo.mp3',
            'filispim': 'https://streaming.cuacfm.org/filispim.mp3',
            'almenara': 'https://cervera.eldialdigital.com:25211/stream',
            'radio3': 'https://rtvelivestream.rtve.es/rtvesec/rne/rne_r3_main.m3u8',
            'roncudo': ''
          } %}{{ stations.get(key, stations['ser']) }}
    - action: media_player.media_stop
      target:
        entity_id: media_player.satellite1
      continue_on_error: true
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ (stream_url | default('')) | length > 0 }}"
          sequence:
            - action: media_player.play_media
              target:
                entity_id: media_player.satellite1_c7ffe4_media_player
              data:
                media_content_type: music
                media_content_id: "{{ stream_url }}"
              continue_on_error: true

poner_radio_browser:
  alias: Poner radio (Radio Browser)
  description: Busca una emisora en Radio Browser (por nombre, aleatoria, tag, país, idioma o local) y la reproduce en el Satellite1
  icon: mdi:radio
  mode: restart
  fields:
    modo:
      name: Modo
      description: Tipo de búsqueda en Radio Browser
      example: byname
      required: true
      selector:
        select:
          options:
            - byname
            - random
            - tag
            - country
            - language
            - popular
            - local
    consulta:
      name: Consulta
      description: Nombre de emisora, tag, código de país (ES) o idioma. No aplica a random/popular/local.
      example: jazz
      required: false
      default: ""
  sequence:
    - variables:
        modo_norm: "{{ (modo | default('byname') | lower | trim) }}"
        consulta_norm: "{{ (consulta | default('') | trim) }}"
    - variables:
        query: >-
          {{ 'name=' ~ (consulta_norm | urlencode) ~ '&hidebroken=true&limit=1&order=clickcount&reverse=true' if modo_norm == 'byname'
          else 'tag=' ~ (consulta_norm | urlencode) ~ '&hidebroken=true&limit=1&order=clickcount&reverse=true' if modo_norm == 'tag'
          else 'countrycode=' ~ (consulta_norm | urlencode) ~ '&hidebroken=true&limit=1&order=clickcount&reverse=true' if modo_norm == 'country'
          else 'language=' ~ (consulta_norm | urlencode) ~ '&hidebroken=true&limit=1&order=clickcount&reverse=true' if modo_norm == 'language'
          else 'countrycode=ES&state=Madrid&hidebroken=true&limit=1&order=clickcount&reverse=true' if modo_norm == 'local'
          else 'hidebroken=true&limit=1&order=random' if modo_norm == 'random'
          else 'hidebroken=true&limit=1&order=clickcount&reverse=true' }}
    - action: rest_command.radio_browser_search
      data:
        query: "{{ query }}"
      response_variable: rb_response
      continue_on_error: true
    - variables:
        rb_ok: "{{ (rb_response is defined) and (rb_response.status == 200) and ((rb_response.content | default([])) | length > 0) }}"
        rb_name: "{{ rb_response.content[0].name if rb_ok else '' }}"
        rb_stream: "{{ (rb_response.content[0].url_resolved | default(rb_response.content[0].url, true)) if rb_ok else '' }}"
    - action: media_player.media_stop
      target:
        entity_id: media_player.satellite1
      continue_on_error: true
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ rb_ok and (rb_stream | length > 0) }}"
          sequence:
            - action: media_player.play_media
              target:
                entity_id: media_player.satellite1_c7ffe4_media_player
              data:
                media_content_type: music
                media_content_id: "{{ rb_stream }}"
              continue_on_error: true
    - variables:
        resultado:
          encontrada: "{{ rb_ok and (rb_stream | length > 0) }}"
          nombre: "{{ rb_name }}"
    - stop: ""
      response_variable: resultado

parar_radio:
  alias: Parar radio
  description: Detiene la reproducción en el Satellite1
  icon: mdi:stop
  mode: single
  sequence:
    - action: media_player.media_stop
      target:
        entity_id: media_player.satellite1_c7ffe4_media_player
      continue_on_error: true
    - action: media_player.media_stop
      target:
        entity_id: media_player.satellite1
      continue_on_error: true

pon_la_radio:
  alias: Pon la radio
  description: Reproduce Cadena SER (Radio Madrid) en el Satellite1
  icon: mdi:radio
  mode: single
  sequence:
    - action: script.poner_radio
      data:
        emisora: ser

apagar_tele:
  alias: Apagar tele
  description: Apaga el Google Streamer (TV GA). No toca la Sony Bravia.
  icon: mdi:television-off
  mode: single
  sequence:
    - action: media_player.turn_off
      target:
        entity_id: media_player.tv_ga_2
      continue_on_error: true

encender_tele:
  alias: Encender tele
  description: Enciende el Google Streamer (TV GA). No toca la Sony Bravia.
  icon: mdi:television
  mode: single
  sequence:
    - action: media_player.turn_on
      target:
        entity_id: media_player.tv_ga_2
      continue_on_error: true

poner_entrada_tele:
  alias: Poner entrada de la tele
  description: Cambia la fuente/entrada de la Sony Bravia real (HDMI, PlayStation, Streamer...). Es la única entidad que soporta select_source.
  icon: mdi:hdmi-port
  mode: restart
  fields:
    entrada:
      name: Entrada
      description: Fuente exacta tal como aparece en el source_list de la Bravia
      example: "HDMI 4"
      required: true
      selector:
        select:
          options:
            - "TV GA"
            - "PlayStation 5"
            - "HDMI 1"
            - "HDMI 2"
            - "HDMI 3/ARC"
            - "HDMI 4"
            - "AV/Component"
            - "Réplica de pantalla"
  sequence:
    - action: media_player.turn_on
      target:
        entity_id: media_player.bravia_kd_43xf8596
      continue_on_error: true
    - action: media_player.select_source
      target:
        entity_id: media_player.bravia_kd_43xf8596
      data:
        source: "{{ entrada }}"
      continue_on_error: true
