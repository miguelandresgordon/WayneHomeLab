# Scripts de voz (radio / tele). Sin rutinas de hábitos (noche, cine, presencia).
# Entity IDs reales de la instancia HAOS (2026.8). Antela aún no está en HA.

# Ruta de audio para streams de radio en el Satellite1 (F1b, medido 2026-11-26
# con infrastructure/voice/radio/radio_probe.py, SER):
#   - ESPHome player vía proxy ffmpeg de HA: arranca en ~1 s pero el satélite
#     corta el stream a los 97-173 s y no vuelve.
#   - Music Assistant (Sendspin): arranca en ~6 s y no se corta.
# Por eso MA primero; ESPHome solo si MA no está disponible.
reproducir_stream_satellite:
  alias: Reproducir stream en Satellite1
  description: Reproduce una URL de radio en el Satellite1 vía Music Assistant (fallback ESPHome)
  icon: mdi:radio-tower
  mode: restart
  fields:
    url:
      name: URL
      description: URL del stream (mp3/aac/HLS)
      required: true
      selector:
        text:
  sequence:
    - variables:
        ma_ok: "{{ states('media_player.satellite1') not in ['unavailable', 'unknown'] }}"
    # Cortar lo que esté sonando por la otra ruta para no solapar audio.
    - action: media_player.media_stop
      target:
        entity_id: media_player.satellite1_c7ffe4_media_player
      continue_on_error: true
    - if:
        - condition: template
          value_template: "{{ ma_ok }}"
      then:
        - action: media_player.play_media
          target:
            entity_id: media_player.satellite1
          data:
            media_content_type: music
            media_content_id: "{{ url }}"
          continue_on_error: true
      else:
        - action: media_player.play_media
          target:
            entity_id: media_player.satellite1_c7ffe4_media_player
          data:
            media_content_type: music
            media_content_id: "{{ url }}"
          continue_on_error: true

poner_radio:
  alias: Poner radio
  description: Reproduce una emisora favorita en el Satellite1
  icon: mdi:radio
  mode: restart
  fields:
    emisora:
      name: Emisora
      description: Clave (ser, radiovoz, filispim, almenara, radio3, roncudo)
      example: ser
      required: false
      default: ser
      selector:
        select:
          options:
            - ser
            - radiovoz
            - filispim
            - almenara
            - radio3
            - roncudo
  sequence:
    - variables:
        key: "{{ (emisora | default('ser') | lower | trim) }}"
        stream_url: >-
          {% set stations = {
            'ser': 'https://playerservices.streamtheworld.com/api/livestream-redirect/SER_MADRID.mp3',
            'radiovoz': 'https://live.radiovoz.es/mp3/stream_lugo.mp3',
            'filispim': 'https://streaming.cuacfm.org/filispim.mp3',
            'almenara': 'https://cervera.eldialdigital.com:25211/stream',
            'radio3': 'https://rtvelivestream.rtve.es/rtvesec/rne/rne_r3_main.m3u8',
            'roncudo': ''
          } %}{{ stations.get(key, stations['ser']) }}
    - if:
        - condition: template
          value_template: "{{ (stream_url | default('')) | length > 0 }}"
      then:
        - action: script.reproducir_stream_satellite
          data:
            url: "{{ stream_url }}"

poner_radio_browser:
  alias: Poner radio (Radio Browser)
  description: Busca una emisora en Radio Browser (por nombre, aleatoria, tag, país, idioma o local) y la reproduce en el Satellite1
  icon: mdi:radio
  mode: restart
  fields:
    modo:
      name: Modo
      description: Tipo de búsqueda en Radio Browser
      example: byname
      required: true
      selector:
        select:
          options:
            - byname
            - random
            - tag
            - country
            - language
            - popular
            - local
    consulta:
      name: Consulta
      description: Nombre de emisora, tag, código de país (ES) o idioma. No aplica a random/popular/local.
      example: jazz
      required: false
      default: ""
  sequence:
    - variables:
        modo_norm: "{{ (modo | default('byname') | lower | trim) }}"
        consulta_norm: "{{ (consulta | default('') | trim) }}"
    - variables:
        query: >-
          {{ 'name=' ~ (consulta_norm | urlencode) ~ '&hidebroken=true&limit=1&order=clickcount&reverse=true' if modo_norm == 'byname'
          else 'tag=' ~ (consulta_norm | urlencode) ~ '&hidebroken=true&limit=1&order=clickcount&reverse=true' if modo_norm == 'tag'
          else 'countrycode=' ~ (consulta_norm | urlencode) ~ '&hidebroken=true&limit=1&order=clickcount&reverse=true' if modo_norm == 'country'
          else 'language=' ~ (consulta_norm | urlencode) ~ '&hidebroken=true&limit=1&order=clickcount&reverse=true' if modo_norm == 'language'
          else 'countrycode=ES&state=Madrid&hidebroken=true&limit=1&order=clickcount&reverse=true' if modo_norm == 'local'
          else 'hidebroken=true&limit=1&order=random' if modo_norm == 'random'
          else 'hidebroken=true&limit=1&order=clickcount&reverse=true' }}
    - action: rest_command.radio_browser_search
      data:
        query: "{{ query }}"
      response_variable: rb_response
      continue_on_error: true
    - variables:
        rb_ok: "{{ (rb_response is defined) and (rb_response.status == 200) and ((rb_response.content | default([])) | length > 0) }}"
        rb_name: "{{ rb_response.content[0].name if rb_ok else '' }}"
        rb_stream: "{{ (rb_response.content[0].url_resolved | default(rb_response.content[0].url, true)) if rb_ok else '' }}"
    - if:
        - condition: template
          value_template: "{{ rb_ok and (rb_stream | length > 0) }}"
      then:
        - action: script.reproducir_stream_satellite
          data:
            url: "{{ rb_stream }}"
    - variables:
        resultado:
          encontrada: "{{ rb_ok and (rb_stream | length > 0) }}"
          nombre: "{{ rb_name }}"
    - stop: ""
      response_variable: resultado

parar_radio:
  alias: Parar radio
  description: Detiene la reproducción en el Satellite1
  icon: mdi:stop
  mode: single
  sequence:
    - action: media_player.media_stop
      target:
        entity_id: media_player.satellite1_c7ffe4_media_player
      continue_on_error: true
    - action: media_player.media_stop
      target:
        entity_id: media_player.satellite1
      continue_on_error: true

pon_la_radio:
  alias: Pon la radio
  description: Reproduce Cadena SER (Radio Madrid) en el Satellite1
  icon: mdi:radio
  mode: single
  sequence:
    - action: script.poner_radio
      data:
        emisora: ser

apagar_tele:
  alias: Apagar tele
  description: Apaga el Google Streamer (TV GA). No toca la Sony Bravia.
  icon: mdi:television-off
  mode: single
  sequence:
    - action: media_player.turn_off
      target:
        entity_id: media_player.tv_ga_2
      continue_on_error: true

encender_tele:
  alias: Encender tele
  description: Enciende el Google Streamer (TV GA). No toca la Sony Bravia.
  icon: mdi:television
  mode: single
  sequence:
    - action: media_player.turn_on
      target:
        entity_id: media_player.tv_ga_2
      continue_on_error: true

poner_entrada_tele:
  alias: Poner entrada de la tele
  description: Cambia la fuente/entrada de la Sony Bravia real (HDMI, PlayStation, Streamer...). Es la única entidad que soporta select_source.
  icon: mdi:hdmi-port
  mode: restart
  fields:
    entrada:
      name: Entrada
      description: Fuente exacta tal como aparece en el source_list de la Bravia
      example: "HDMI 4"
      required: true
      selector:
        select:
          options:
            - "TV GA"
            - "PlayStation 5"
            - "HDMI 1"
            - "HDMI 2"
            - "HDMI 3/ARC"
            - "HDMI 4"
            - "AV/Component"
            - "Réplica de pantalla"
  sequence:
    - action: media_player.turn_on
      target:
        entity_id: media_player.bravia_kd_43xf8596
      continue_on_error: true
    - action: media_player.select_source
      target:
        entity_id: media_player.bravia_kd_43xf8596
      data:
        source: "{{ entrada }}"
      continue_on_error: true

# Spotify por voz vía Music Assistant (F2). Busca en Spotify (búsqueda difusa
# del propio Spotify) + tus playlists de la biblioteca, puntúa cada candidato
# por solapamiento de palabras normalizadas (sin tildes ni signos) entre la
# consulta y «título + artistas», y reproduce el mejor en el Satellite1.
# Devuelve {encontrado, nombre, artista, tipo} para la respuesta por voz.
# Tests: tests/test_musica_script.py (renderiza estas plantillas con jinja2).
musica_buscar_y_poner:
  alias: Buscar y poner música (Spotify vía MA)
  description: Busca canción, disco, playlist o artista en Music Assistant y pone el mejor resultado en el Satellite1
  icon: mdi:spotify
  mode: restart
  fields:
    tipo:
      name: Tipo
      required: true
      default: track
      selector:
        select:
          options: [track, album, playlist, artist]
    nombre:
      name: Nombre (título, disco, playlist o artista)
      required: false
      default: ""
      selector:
        text:
    artista:
      name: Artista
      required: false
      default: ""
      selector:
        text:
  sequence:
    - variables:
        tipo_n: "{{ tipo | default('track') }}"
        clave: "{{ {'track': 'tracks', 'album': 'albums', 'playlist': 'playlists', 'artist': 'artists'}[tipo | default('track')] }}"
        ma_entry: "{{ config_entry_id('media_player.satellite1') }}"
        nombre_limpio: >-
          {%- set ns = namespace(n=(nombre | default('') | lower | trim), done=false) -%}
          {%- for a in ['la canción ', 'la cancion ', 'el tema ', 'una canción ', 'una cancion '] -%}
          {%- if not ns.done and ns.n.startswith(a) -%}{%- set ns.n = ns.n[a | length:] -%}{%- set ns.done = true -%}{%- endif -%}
          {%- endfor -%}{{ ns.n }}
    - variables:
        consulta: "{{ (nombre_limpio ~ ' ' ~ (artista | default(''))) | trim }}"
    - action: music_assistant.search
      data:
        config_entry_id: "{{ ma_entry }}"
        name: "{{ consulta }}"
        media_type:
          - "{{ tipo_n }}"
        limit: 8
      response_variable: res
      continue_on_error: true
    - if:
        - condition: template
          value_template: "{{ tipo_n == 'playlist' }}"
      then:
        - action: music_assistant.get_library
          data:
            config_entry_id: "{{ ma_entry }}"
            media_type: playlist
            search: "{{ nombre_limpio }}"
            limit: 25
          response_variable: lib
          continue_on_error: true
    - variables:
        cands: >-
          {{ ((lib['items'] if lib is defined and lib is mapping and 'items' in lib else [])
              + (res[clave] if res is defined and res is mapping and clave in res else [])) }}
    - variables:
        mejor: >-
          {%- macro toks(s) -%}
          {%- set ns = namespace(t=(s | string | lower)) -%}
          {%- for k, v in [['á', 'a'], ['é', 'e'], ['í', 'i'], ['ó', 'o'], ['ú', 'u'], ['ü', 'u'], ['ñ', 'n']] -%}{%- set ns.t = ns.t.replace(k, v) -%}{%- endfor -%}
          {%- for ch in ['(', ')', '[', ']', '-', ':', '.', ',', '!', '?', '¿', '¡', "'", '"', '/', '+', '&', '$', '*'] -%}{%- set ns.t = ns.t.replace(ch, ' ') -%}{%- endfor -%}
          {{- ns.t.split() | reject('in', ['de', 'del', 'la', 'el', 'los', 'las', 'the', 'y', 'and', 'a', 'feat', 'ft']) | unique | join(' ') -}}
          {%- endmacro -%}
          {%- set q = toks(consulta).split() -%}
          {%- set ns = namespace(best=-1, score=-1.0) -%}
          {%- for c in cands -%}
          {%- set ct = toks(c.name ~ ' ' ~ (c.artists | default([]) | map(attribute='name') | join(' '))).split() -%}
          {%- set nt = toks(c.name).split() -%}
          {%- set inter = q | select('in', ct) | list | length -%}
          {%- set union = (q + ct) | unique | list | length -%}
          {%- set title_hit = (nt | length > 0) and ((nt | select('in', q) | list | length) == (nt | length)) -%}
          {%- set s = ((inter / union) if union > 0 else 0) + (0.5 if title_hit else 0) -%}
          {%- if s > ns.score -%}{%- set ns.best = loop.index0 -%}{%- set ns.score = s -%}{%- endif -%}
          {%- endfor -%}
          {{- ns.best if ns.score > 0 else (0 if cands | length > 0 else -1) -}}
    - variables:
        elegido: "{{ cands[mejor | int] if (mejor | int) >= 0 else {} }}"
    - if:
        - condition: template
          value_template: "{{ (mejor | int) >= 0 }}"
      then:
        # Sin esperar: MA tarda ~30 s en cargar una playlist/disco entero.
        - action: script.turn_on
          target:
            entity_id: script.musica_reproducir_uri
          data:
            variables:
              uri: "{{ elegido.uri }}"
              tipo: "{{ tipo_n }}"
    - variables:
        resultado:
          encontrado: "{{ (mejor | int) >= 0 }}"
          nombre: "{{ elegido.name | default('') }}"
          artista: "{{ (elegido.artists | default([]) | map(attribute='name') | list)[:2] | join(' y ') }}"
          tipo: "{{ tipo_n }}"
    - stop: ""
      response_variable: resultado

musica_reproducir_uri:
  alias: Reproducir URI de Music Assistant en Satellite1
  description: Reproduce un elemento de Music Assistant (lo lanza musica_buscar_y_poner sin esperar)
  icon: mdi:play
  mode: restart
  fields:
    uri:
      name: URI
      required: true
      selector:
        text:
    tipo:
      name: Tipo
      required: true
      selector:
        text:
  sequence:
    - action: media_player.media_stop
      target:
        entity_id: media_player.satellite1_c7ffe4_media_player
      continue_on_error: true
    - action: music_assistant.play_media
      target:
        entity_id: media_player.satellite1
      data:
        media_id: "{{ uri }}"
        media_type: "{{ tipo }}"
        enqueue: replace
      continue_on_error: true
