# ==============================================================================
# Home Assistant — Template sensors
#
# Este archivo se incluye bajo la clave `template:` en configuration.yaml
# (NO bajo `sensor:` — la sintaxis legacy `sensor: - platform: template` se
# retiró y HA la reporta como "Configuración YAML no compatible").
#
# Reference: https://www.home-assistant.io/integrations/template/
# ==============================================================================

# --- Gemini API Cost Tracking ---
# Tracks estimated monthly cost based on conversation count.
# Gemini 2.0 Flash pricing (as of 2025):
#   Input:  $0.10 per 1M tokens
#   Output: $0.40 per 1M tokens
#   Avg conversation: ~500 input + ~200 output tokens
#
# `default_entity_id` fija el entity_id exacto (sensor.gemini_api_daily_cost)
# aunque el `name` cambie o lleve paréntesis. Solo se aplica en la primera
# creación de la entidad (junto con `unique_id`).
- sensor:
    - name: "Gemini API Daily Cost (Est.)"
      unique_id: gemini_api_daily_cost
      default_entity_id: sensor.gemini_api_daily_cost
      unit_of_measurement: "USD"
      icon: mdi:currency-usd
      state: >-
        {% set conversations = states('counter.daily_voice_conversations') | int(0) %}
        {% set input_cost_per_token = 0.10 / 1000000 %}
        {% set output_cost_per_token = 0.40 / 1000000 %}
        {% set avg_input_tokens = 500 %}
        {% set avg_output_tokens = 200 %}
        {% set cost = conversations * ((avg_input_tokens * input_cost_per_token) + (avg_output_tokens * output_cost_per_token)) %}
        {{ cost | round(4) }}

    - name: "Gemini API Monthly Projection"
      unique_id: gemini_api_monthly_projection
      default_entity_id: sensor.gemini_api_monthly_projection
      unit_of_measurement: "USD"
      icon: mdi:chart-line
      state: >-
        {% set daily_cost = states('sensor.gemini_api_daily_cost') | float(0) %}
        {{ (daily_cost * 30) | round(2) }}

