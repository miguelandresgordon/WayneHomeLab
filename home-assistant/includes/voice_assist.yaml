# ==============================================================================
# Home Assistant — Voice Assist helpers
#
# Entidades expuestas a Assist y alias recomendados.
# Configurar en UI: Configuración → Asistentes de voz → Exponer
# ==============================================================================

# Checklist STT/NLU (ver docs/wake-word-mariano.md):
#
# Pipeline de voz (Configuración → Asistentes de voz):
#   - Idioma: Español (es)
#   - STT: openai_whisper_cloud (Groq) — whisper-large-v3-turbo
#   - TTS: Wyoming Piper (core-piper:10200)
#   - Conversation: Home Assistant (español)
#
# Entidades a exponer con alias en español:
#   - light.yeelink_mono6_6409_light → alias: "lámpara", "luces del salón"
#   - light.bombilla_dormitorio     → alias: "bombilla", "luz del dormitorio", "luz del cuarto"
#   - media_player.tv_ga_2          → alias: "tele", "televisión", "televisor", "tv", "TV GA"
#     Frases: custom_sentences/es/tv.yaml → siempre Google Streamer, nunca Bravia/Cast
#   - script.buenas_noches / buenos_dias / cine / me_voy / pon_la_radio
#
# No exponer: Cast duplicados (media_player.tv_ga, media_player.bravia_4k_gb_atv3),
# Bravia androidtv_remote (deshabilitada), media_player del satélite (salvo radio
# vía script), sensores temp/humedad, escenas.
#
# Prompt Groq Whisper: incluir tele, televisión, tv, radio (si no, STT sesga a lámpara).
#
# Evitar conflictos NLU:
#   - Asignar lámpara al área "Salón" para frases con "del salón"
#   - Renombrar escenas genéricas que coincidan con nombres de área
#
# Satellite1 (Configuración → Dispositivos → ESPHome):
#   - Pipeline: el que usa Groq + Piper
#   - Wake word: Mariano (tras flashear firmware custom)
#   - Wake word sensitivity: Slightly sensitive
#   - probability_cutoff: calibrar por escalones 98% → 92% → 85% (ver runbook)
#   - voice_assistant overlay: noise_suppression_level 2, auto_gain 12 dBFS
#
# Diagnóstico por etapa (WAV en /share/assist_pipeline):
#   1. No despierta → cutoff / mute / modelo Mariano no activo
#   2. WAV malo → auto_gain / noise_suppression en ESPHome
#   3. WAV bueno, texto mal → prompt Groq / idioma es
#   4. Texto OK, acción mal → alias / áreas / custom_sentences
#   5. Acción OK, voz mala → Piper / competencia con radio en Satellite1
