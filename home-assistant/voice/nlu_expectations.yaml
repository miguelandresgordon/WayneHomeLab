# Expectativas de NLU en vivo (infrastructure/voice/nlu_live_check.py).
# Frases reales de Groq (F0) + órdenes diarias. `intent: null` = no debe hacer nada.
cases:
  # Radio — variantes recortadas reales
  - {text: "Pon la cadena SER.", intent: PonRadioFavorita}
  - {text: "Con la SER.", intent: PonRadioFavorita}
  - {text: "Hola SER.", intent: PonRadioFavorita}
  - {text: "O la cadena SER.", intent: PonRadioFavorita}
  - {text: "¡Von la SER!", intent: PonRadioFavorita}
  - {text: "Ponla SER.", intent: PonRadioFavorita}
  - {text: "Por la SER.", intent: PonRadioFavorita}
  - {text: "Hola, Cadena Cero.", intent: PonRadioFavorita}
  - {text: "la ser", intent: PonRadioFavorita}
  - {text: "sintoniza radio 3", intent: PonRadioFavorita}
  - {text: "Pon radio 3", intent: PonRadioFavorita}
  - {text: "Pon la radio BBC", intent: PonRadioBrowser}
  - {text: "Para la radio.", intent: ParaRadioFavorita}
  - {text: "Cállate.", intent: ParaRadioFavorita}
  # Lámpara
  - {text: "Con la lámpara al 50%.", intent: LamparaBrillo}
  - {text: "Con el brillo de la lámpara al máximo.", intent: LamparaBrillo}
  - {text: "Pon la lámpara al mínimo.", intent: [HassLightSet, LamparaBrillo]}
  - {text: "Pon el brillo de la lámpara al 50%.", intent: [HassLightSet, LamparaBrillo]}
  - {text: "Sube el brillo de la lámpara.", intent: HassLightSet}
  - {text: "enciende la lámpara", intent: EnciendeLaLampara}
  - {text: "Entiende la lámpara.", intent: EnciendeLaLampara}
  - {text: "apaga la lámpara", intent: ApagaLaLampara}
  - {text: "Apagada la lámpara.", intent: ApagaLaLampara}
  # Tele
  - {text: "enciende la tele", intent: EnciendeLaTele}
  - {text: "apaga la tele", intent: ApagaLaTele}
  - {text: "Aparar la tele.", intent: ApagaLaTele}
  - {text: "Pon el HDMI 3 en la tele.", intent: CambiaEntradaTele}
  # Ruido real de TV / alucinaciones: no deben disparar radio ni luces
  - {text: "Gracias por ver el video.", intent: IgnorarRuido}
  - {text: "¿Qué va a ser movido?", intent: [null, HassNevermind, HassGetState]}  # consulta inocua
  # Spotify vía Music Assistant (F2)
  - {text: "Pon House Tour de Sabrina Carpenter.", intent: [MusicaCancion, HassMediaSearchAndPlay]}  # artista fuera de la biblioteca
  - {text: "Pon Malamente de Rosalía.", intent: MusicaCancion}
  - {text: "Pon la canción Despacito de Luis Fonsi.", intent: MusicaCancion}
  - {text: "Reproduce una canción de Los Caños.", intent: MusicaArtista}
  - {text: "Pon el disco Motomami de Rosalía.", intent: MusicaDisco}
  - {text: "Pon mi playlist En bucle.", intent: MusicaPlaylist}
  - {text: "Pon música de Bad Bunny.", intent: MusicaArtista}
  - {text: "Siguiente canción.", intent: MusicaSiguiente}
  - {text: "Canción anterior.", intent: MusicaAnterior}
  - {text: "Pausa la música.", intent: MusicaPausa}
  - {text: "Sigue.", intent: MusicaSigue}
  - {text: "Sube el volumen.", intent: VolumenSube}
  - {text: "Baja el volumen.", intent: VolumenBaja}
  - {text: "Volumen al 30.", intent: VolumenPon}
  - {text: "¿Qué suena?", intent: MusicaQueSuena}
  - {text: "pon un temporizador de 5 minutos", intent: HassStartTimer}
  - {text: "sube el volumen de la tele", intent: SubeVolumenTele}
