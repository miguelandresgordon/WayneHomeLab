# ==============================================================================
# sysctl.conf — Kernel Tuning for Proxmox on RPi 5
#
# Installed to: /etc/sysctl.d/99-waynelab.conf
# Applied by: setup_host.sh
# ==============================================================================

# --- Memory ---
# Reduce swap usage (prefer RAM, RPi 5 has 4-8GB)
vm.swappiness=10

# Memory overcommit (required for KVM VM memory allocation)
vm.overcommit_memory=1

# --- File System ---
# Increase inotify watchers (Home Assistant uses many)
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=512

# Increase max open files for VM workloads
fs.file-max=2097152

# --- Network Bridge ---
# Required for Proxmox bridge networking with iptables
net.bridge.bridge-nf-call-iptables=1
net.bridge.bridge-nf-call-ip6tables=1

# --- Network Performance ---
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.ipv4.tcp_rmem=4096 87380 16777216
net.ipv4.tcp_wmem=4096 65536 16777216
