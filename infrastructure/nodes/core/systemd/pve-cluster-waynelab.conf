# Drop-in for pve-cluster.service -> /etc/systemd/system/pve-cluster.service.d/waynelab.conf
# Self-heals the /etc/hosts regression (cloud-init -> 127.0.1.1) and never gives up:
# the stock unit stops after 5 fast failures and takes pve-guests (all VMs) down with it.

[Unit]
StartLimitIntervalSec=0

[Service]
ExecStartPre=/usr/local/sbin/waynelab-ensure-hosts
Restart=on-failure
RestartSec=5
