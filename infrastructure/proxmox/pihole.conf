# ==============================================================================
# pihole.conf — Proxmox VM Configuration Reference for Pi-hole (Debian 12)
#
# Expected config after create_pihole_vm.sh runs.
# Location on Proxmox host: /etc/pve/qemu-server/<VMID>.conf
#
# DO NOT apply this file directly — use create_pihole_vm.sh for provisioning.
# ==============================================================================

# --- VM identity ---
name: pihole
arch: aarch64
ostype: l26
machine: virt
onboot: 1
startup: order=1

# --- Compute resources (host RPi 5 with 8 GB RAM) ---
cores: 1
memory: 768
balloon: 256

# --- BIOS & Boot (UEFI required on ARM64) ---
bios: ovmf
efidisk0: local:101/vm-101-disk-0.raw,efitype=4m,pre-enrolled-keys=0,size=528K
boot: order=scsi0

# --- Storage (directory storage "local"; NOT local-lvm) ---
scsihw: virtio-scsi-pci
scsi0: local:101/vm-101-disk-1.raw,size=8G
scsi1: local:101/vm-101-cloudinit.qcow2,media=cdrom

# --- Network (bridged LAN) ---
net0: virtio=bc:24:11:69:81:fe,bridge=vmbr0

# --- Cloud-init (static IP; DNS temporary until Pi-hole is DNS for LAN) ---
ciuser: pi
ipconfig0: ip=192.168.1.53/24,gw=192.168.1.1
nameserver: 1.1.1.1
searchdomain: lan
# sshkeys: <set by create_pihole_vm.sh>

# --- Agent & Serial ---
agent: enabled=1
serial0: socket
vga: serial0
