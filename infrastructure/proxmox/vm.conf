# ==============================================================================
# vm.conf — Proxmox VM Configuration Reference for HAOS
#
# This file documents the expected VM configuration after create_haos_vm.sh runs.
# Location on Proxmox host: /etc/pve/qemu-server/<VMID>.conf
#
# DO NOT apply this file directly — use create_haos_vm.sh for provisioning.
# ==============================================================================

# --- VM identity ---
name: haos
ostype: l26
machine: virt
onboot: 1

# --- Compute resources ---
cores: 2
memory: 2048

# --- BIOS & Boot ---
bios: ovmf
efidisk0: local-lvm:vm-100-disk-0,efitype=4m,pre-enrolled-keys=0,size=528K
boot: order=scsi0

# --- Storage ---
scsihw: virtio-scsi-pci
scsi0: local-lvm:vm-100-disk-1,size=32G

# --- Network ---
net0: virtio=XX:XX:XX:XX:XX:XX,bridge=vmbr0

# --- Agent & Serial ---
agent: enabled=1
serial0: socket
