# ==============================================================================
# wireguard.conf — Proxmox VM Configuration Reference for WireGuard + Caddy
#
# Expected config after create_wireguard_vm.sh runs.
# Location on Proxmox host: /etc/pve/qemu-server/<VMID>.conf
#
# DO NOT apply this file directly — use create_wireguard_vm.sh for provisioning.
# ==============================================================================

# --- VM identity ---
name: wireguard
arch: aarch64
ostype: l26
machine: virt
onboot: 1
startup: order=2

# --- Compute resources (host RPi 5 with 8 GB RAM) ---
# Keep slim: WG + Caddy only. Leave ~1 GB for Proxmox host.
cores: 1
memory: 512
balloon: 128

# --- BIOS & Boot (UEFI required on ARM64) ---
bios: ovmf
efidisk0: local:102/vm-102-disk-0.raw,efitype=4m,pre-enrolled-keys=0,size=528K
boot: order=scsi0

# --- Storage (directory storage "local"; NOT local-lvm) ---
scsihw: virtio-scsi-pci
scsi0: local:102/vm-102-disk-1.raw,size=4G
scsi1: local:102/vm-102-cloudinit.qcow2,media=cdrom

# --- Network (bridged LAN) ---
# Reserve DHCP 192.168.1.55 → this MAC on the router.
net0: virtio=bc:24:11:e9:6c:c9,bridge=vmbr0

# --- Cloud-init ---
ciuser: pi
ipconfig0: ip=192.168.1.55/24,gw=192.168.1.1
nameserver: 1.1.1.1
searchdomain: lan
# sshkeys: <set by create_wireguard_vm.sh>

# --- Agent & Serial ---
agent: enabled=1
serial0: socket
vga: serial0
