substitutions:
  name: satellite1-c7ffe4
  friendly_name: satellite1
  xmos_fw_version: v1.0.3

  # OPTIONALLY, set the log level to debug, info, warn, error
  log_level: info

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

packages:
  FutureProofHomes.Satellite1:
    url: &repo_url https://github.com/futureproofhomes/satellite1-esphome
    # Fijado al commit de staging con el que se compiló el firmware vivo
    # (2026-09-10). «staging» a secas trae XMOS 1.1.0-beta y +5000 líneas:
    # sin rollback OTA, solo cambiamos lo nuestro. Subir de versión = decisión aparte.
    ref: &repo_ref 9814bf598976060a5a5b999448398877d15333e8
    files:
      # Main config files, don't remove
      - config/satellite1.base.yaml
      - config/common/dashboard_build.yaml
      - path: config/common/components.external.yaml
        vars:
          ext_comp_repo_url: *repo_url
          ext_comp_repo_ref: *repo_ref

      ## OPTIONALLY, uncomment if want extra memory, wifi and xmos control of the device.
      # - config/common/debug.yaml
      # yamllint enable rule:comments-indentation

logger:
  level: ${log_level}
  logs:
    # El sensor de luz avisa cada segundo («Sensors blacked out»): ruido en HA.
    ltr_als_ps: ERROR

## API encryption is REQUIRED on this device (factory/Take Control).
## Without this key, Device Builder loops: RequiresEncryptionAPIError
## and never starts the OTA upload. Key lives in HAOS esphome/secrets.yaml
## (copied from HA config entry noise_psk). Never commit the key.
api:
  encryption:
    key: !secret api_encryption_key

## Wi-Fi hardcoded: el NVS se pierde en flash USB / wipe. Secrets en
## HAOS /config/esphome/secrets.yaml (NO /config/secrets.yaml de HA).
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

## Custom wake word Mariano (WayneHomeLab)
## Model: http://192.168.1.110:8123/local/wake-word/mariano.esphome.json
## Cutoff YAML = Moderately (92%). El select de HA calibra Mariano con el
## extend del select (lista). voice_assistant usa id: va (singleton ESPHome 2026).
micro_wake_word:
  id: mww
  models:
    - id: mariano
      model: http://192.168.1.110:8123/local/wake-word/mariano.esphome.json
      probability_cutoff: 92%

## DSP post-wake + telemetría STT → input_text.last_stt_text en HA
## id: va (mismo que FPH). SIN !extend — rompe el compile en ESPHome 2026.8.
voice_assistant:
  id: va
  noise_suppression_level: 2
  auto_gain: 12dBFS
  volume_multiplier: 2.0
  on_stt_end:
    - homeassistant.event:
        event: esphome.satellite1_stt_end
        data:
          text: !lambda 'return x;'

## Sensibilidad HA también calibra Mariano (FPH de stock solo toca okay_nabu/hey_jarvis).
## !extend SÍ aplica aquí: select es una lista de componentes.
select:
  - id: !extend mww_sensitivity_select
    on_value:
      - lambda: |-
          if (x == "Slightly sensitive") {
            id(okay_nabu).set_probability_cutoff(217);    // 0.85
            id(hey_jarvis).set_probability_cutoff(247);   // 0.97
            id(mariano).set_probability_cutoff(250);      // 0.98
          } else if (x == "Moderately sensitive") {
            id(okay_nabu).set_probability_cutoff(176);    // 0.69
            id(hey_jarvis).set_probability_cutoff(235);    // 0.92
            id(mariano).set_probability_cutoff(235);      // 0.92
          } else if (x == "Very sensitive") {
            id(okay_nabu).set_probability_cutoff(143);    // 0.56
            id(hey_jarvis).set_probability_cutoff(212);   // 0.83
            id(mariano).set_probability_cutoff(217);      // 0.85
          }


## Nivel del micro (F3, modo reunión automático en HA).
## Canal 0 del XMOS (salida procesada) a 16 kHz, int32 estéreo intercalado.
## El callback solo acumula; el sensor publica dBFS cada 2 s y resetea.
globals:
  - id: mic_sq_sum
    type: double
    restore_value: false
    initial_value: '0.0'
  - id: mic_sq_n
    type: uint32_t
    restore_value: false
    initial_value: '0'

microphone:
  - id: !extend sat1_mics
    on_data:
      - lambda: |-
          const int32_t *s = reinterpret_cast<const int32_t *>(x.data());
          const size_t n = x.size() / sizeof(int32_t);
          double acc = 0.0;
          for (size_t i = 0; i < n; i += 2) {
            const double v = s[i] / 2147483648.0;
            acc += v * v;
          }
          id(mic_sq_sum) += acc;
          id(mic_sq_n) += n / 2;

sensor:
  - platform: template
    id: mic_level
    name: "Mic level"
    icon: mdi:microphone-settings
    unit_of_measurement: dBFS
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 2s
    lambda: |-
      if (id(mic_sq_n) == 0) return {};
      const double ms = id(mic_sq_sum) / id(mic_sq_n);
      id(mic_sq_sum) = 0.0;
      id(mic_sq_n) = 0;
      return (float) (10.0 * log10(ms + 1e-12));

## Wake word activo (F3, modo reunión). Desactiva los modelos sin parar
## micro_wake_word: el micro sigue vivo y «Mic level» sigue midiendo.
switch:
  - platform: template
    id: wake_word_enabled
    name: "Wake word activo"
    icon: mdi:account-voice
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - micro_wake_word.disable_model: mariano
      - micro_wake_word.disable_model: okay_nabu
      - micro_wake_word.disable_model: hey_jarvis
    on_turn_on:
      - micro_wake_word.enable_model: mariano
