substitutions:
  name: satellite1-c7ffe4
  friendly_name: satellite1
  xmos_fw_version: v1.0.3

  # OPTIONALLY, set the log level to debug, info, warn, error
  log_level: info

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

packages:
  FutureProofHomes.Satellite1:
    url: &repo_url https://github.com/futureproofhomes/satellite1-esphome
    ref: &repo_ref staging
    refresh: 1d
    files:
      # Main config files, don't remove
    - config/satellite1.base.yaml
    - config/common/dashboard_build.yaml
    - path: config/common/components.external.yaml
      vars:
        ext_comp_repo_url: *repo_url
        ext_comp_repo_ref: *repo_ref

      ## OPTIONALLY, uncomment if want extra memory, wifi and xmos control of the device.
      # - config/common/debug.yaml
      # yamllint enable rule:comments-indentation

logger:
  level: ${log_level}

## API encryption is REQUIRED on this device (factory/Take Control).
## Without this key, Device Builder loops: RequiresEncryptionAPIError
## and never starts the OTA upload. Key lives in HAOS esphome/secrets.yaml
## (copied from HA config entry noise_psk). Never commit the key.
api:
  encryption:
    key: !secret api_encryption_key

## Wi-Fi hardcoded: el NVS se pierde en flash USB / wipe. Secrets en
## HAOS /config/esphome/secrets.yaml (NO /config/secrets.yaml de HA).
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

## Custom wake word Mariano (WayneHomeLab)
## Model: http://192.168.1.110:8123/local/wake-word/mariano.esphome.json
## Cutoff YAML = Moderately (92%). El select de HA calibra Mariano con el
## extend del select (lista). voice_assistant usa id: va (singleton ESPHome 2026).
micro_wake_word:
  id: mww
  models:
    - id: mariano
      model: http://192.168.1.110:8123/local/wake-word/mariano.esphome.json
      probability_cutoff: 92%

## DSP post-wake + telemetría STT → input_text.last_stt_text en HA
## id: va (mismo que FPH). SIN !extend — rompe el compile en ESPHome 2026.8.
voice_assistant:
  id: va
  noise_suppression_level: 2
  auto_gain: 12dBFS
  volume_multiplier: 2.0
  on_stt_end:
    - homeassistant.event:
        event: esphome.satellite1_stt_end
        data:
          text: !lambda 'return x;'

## Sensibilidad HA también calibra Mariano (FPH de stock solo toca okay_nabu/hey_jarvis).
## !extend SÍ aplica aquí: select es una lista de componentes.
select:
  - id: !extend mww_sensitivity_select
    on_value:
      - lambda: |-
          if (x == "Slightly sensitive") {
            id(okay_nabu).set_probability_cutoff(217);    // 0.85
            id(hey_jarvis).set_probability_cutoff(247);   // 0.97
            id(mariano).set_probability_cutoff(250);      // 0.98
          } else if (x == "Moderately sensitive") {
            id(okay_nabu).set_probability_cutoff(176);    // 0.69
            id(hey_jarvis).set_probability_cutoff(235);    // 0.92
            id(mariano).set_probability_cutoff(235);      // 0.92
          } else if (x == "Very sensitive") {
            id(okay_nabu).set_probability_cutoff(143);    // 0.56
            id(hey_jarvis).set_probability_cutoff(212);   // 0.83
            id(mariano).set_probability_cutoff(217);      // 0.85
          }
