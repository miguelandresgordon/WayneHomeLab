# Fragmento ESPHome — Take Control + OTA en Satellite1
#
# Artefactos en HA (no hace falta serve_model.sh en el Mac):
#   /config/esphome/models/mariano.{json,tflite}
#   /config/www/wake-word/mariano.{json,tflite}
#   URL: http://192.168.1.110:8123/local/wake-word/mariano.esphome.json
#
# Pegar en el YAML de Take Control DESPUÉS de packages (okay_nabu /
# hey_jarvis / stop vienen del package FPH).
#
# ESPHome 2026.x (Device Builder 2026.8.2):
#   - voice_assistant es singleton → no usar extend sobre ese id
#     (error: "The character '!' cannot be used"). Usar id: va
#   - select SÍ es lista → id: !extend mww_sensitivity_select es válido
#
# Cutoff uint8 = round(prob * 255). El select de HA calibra Mariano
# tras flashear este lambda (FPH de stock solo toca okay_nabu / hey_jarvis).
#   Slightly sensitive   → 98% / 250  (TV alta; menos falsos wakes)
#   Moderately sensitive → 92% / 235  (uso diario)
#   Very sensitive       → 85% / 217  (si no despierta a 3 m)
#
# API: el firmware de fábrica lleva Noise encryption. Take Control DEBE
# incluir `api.encryption.key: !secret api_encryption_key` con el noise_psk
# actual. Si no, Install Wi-Fi se queda en RequiresEncryptionAPIError.
#
# DSP post-wake: sin esto Groq recibe audio Satellite1 pobre.
# on_stt_end → evento HA esphome.satellite1_stt_end → input_text.last_stt_text

micro_wake_word:
  id: mww
  models:
    - model: http://192.168.1.110:8123/local/wake-word/mariano.esphome.json
      id: mariano
      probability_cutoff: 92%

# --- En logger / packages del firmware (Take Control) ---
# log_level: info   (no debug permanente; 4 GB RAM / SSD USB)
# packages refresh: 1d  (no 1s)

voice_assistant:
  id: va
  noise_suppression_level: 2
  auto_gain: 12dBFS
  volume_multiplier: 2.0
  on_stt_end:
    - homeassistant.event:
        event: esphome.satellite1_stt_end
        data:
          text: !lambda 'return x;'

select:
  - id: !extend mww_sensitivity_select
    on_value:
      - lambda: |-
          if (x == "Slightly sensitive") {
            id(okay_nabu).set_probability_cutoff(217);    // 0.85
            id(hey_jarvis).set_probability_cutoff(247);   // 0.97
            id(mariano).set_probability_cutoff(250);      // 0.98
          } else if (x == "Moderately sensitive") {
            id(okay_nabu).set_probability_cutoff(176);    // 0.69
            id(hey_jarvis).set_probability_cutoff(235);   // 0.92
            id(mariano).set_probability_cutoff(235);      // 0.92
          } else if (x == "Very sensitive") {
            id(okay_nabu).set_probability_cutoff(143);    // 0.56
            id(hey_jarvis).set_probability_cutoff(212);   // 0.83
            id(mariano).set_probability_cutoff(217);      // 0.85
          }
