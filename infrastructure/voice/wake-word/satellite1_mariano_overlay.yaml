# Fragmento ESPHome — ya aplicado en HAOS /config/esphome/satellite1-c7ffe4.yaml
#
# Artefactos en HA (no hace falta serve_model.sh en el Mac):
#   /config/esphome/models/mariano.{json,tflite}
#   /config/www/wake-word/mariano.{json,tflite}
#   URL: http://192.168.1.110:8123/local/wake-word/mariano.json
#
# En el YAML de Take Control basta con AÑADIR el modelo (okay_nabu /
# hey_jarvis / stop vienen del package FPH).
# probability_cutoff: el train 2026-08-26 sugirió 98%, pero en sala real suele ser
# demasiado estricto. Empezar en 92% y bajar a 85% si no despierta; subir si hay
# falsos positivos con TV (junto con automatizaciones satellite1_mute_tv_* en HA).

micro_wake_word:
  id: mww
  models:
    - model: http://192.168.1.110:8123/local/wake-word/mariano.esphome.json
      id: mariano
      probability_cutoff: 92%

# --- En logger / packages del firmware (Take Control) ---
# log_level: info   (no debug permanente; 4 GB RAM / SSD USB)
# packages refresh: 1d  (no 1s)

# --- Tras Take Control, probar en voice_assistant (mejora STT post-wake) ---
voice_assistant:
  noise_suppression_level: 2
  auto_gain: 12 dBFS
  volume_multiplier: 2.0

# --- En select.mww_sensitivity_select, extender lambda para mariano (opcional) ---
# Añadir dentro del on_value lambda existente:
#   id(mariano).set_probability_cutoff(217);  # Slightly sensitive (~85%)
#   id(mariano).set_probability_cutoff(176);  # Moderately sensitive (~69%)
#   id(mariano).set_probability_cutoff(143);  # Very sensitive (~56%)
