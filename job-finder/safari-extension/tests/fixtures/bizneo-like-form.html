<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Candidatura — ATS de prueba (Bizneo-like)</title>
</head>
<body>
  <main>
    <h1>Solicitud de empleo</h1>
    <form id="step-1">
      <fieldset>
        <legend>Datos personales</legend>
        <label>Nombre <input name="first_name" autocomplete="given-name"></label>
        <label>Apellidos <input name="last_name" autocomplete="family-name"></label>
        <label>Nombre completo <input name="full_name" autocomplete="name" required></label>
        <label>Correo electrónico <input name="email" type="email" autocomplete="email" required></label>
        <label>Teléfono <input name="phone" type="tel" autocomplete="tel"></label>
        <label>Ciudad <input name="city" autocomplete="address-level2"></label>
        <label>LinkedIn <input name="linkedin" type="url"></label>
      </fieldset>
      <fieldset>
        <legend>Puesto</legend>
        <label>Puesto al que optas <input name="position"></label>
        <label>
          Modalidad
          <select name="work_mode">
            <option value="">Selecciona</option>
            <option value="remote">Remoto</option>
            <option value="hybrid">Híbrido</option>
            <option value="onsite">Presencial</option>
          </select>
        </label>
      </fieldset>
      <label>Carta de motivación <textarea name="cover_letter" rows="4"></textarea></label>
      <label>Currículum vitae <input name="cv" type="file" accept="application/pdf,.pdf"></label>
      <label><input name="privacy_consent" type="checkbox"> He leído la política de privacidad</label>
      <label><input name="terms" type="checkbox"> Acepto las condiciones legales</label>
      <input name="csrf_token" type="hidden" value="ats-csrf-must-never-leave">
      <label>Contraseña del portal <input name="password" type="password"></label>
      <button type="button" id="next">Continuar (no enviar)</button>
    </form>
    <form id="step-2" hidden>
      <h2>Paso 2 — Disponibilidad</h2>
      <label>Disponibilidad <input name="availability"></label>
      <label>Salario esperado <input name="salary" type="number"></label>
      <button type="submit">Enviar candidatura (no usar en la prueba)</button>
    </form>
  </main>
  <script>
    document.getElementById("next").addEventListener("click", () => {
      document.getElementById("step-1").hidden = true;
      document.getElementById("step-2").hidden = false;
    });
  </script>
</body>
</html>
