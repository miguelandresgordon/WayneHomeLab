project:
  name: "Proyecto Charo"
  version: "1.0.0-alpha"
  description: "Asistente de voz open-source para Home Assistant"
  author: "Wayne"
  license: "MIT"
  repository: "https://github.com/tu-usuario/WayneHomeLab"

architecture:
  nodes:
    - name: "Raspberry Pi 4"
      role: "Audio Node"
      services:
        - "Wake Word Detection"
        - "Voice Activity Detection"
        - "Audio Capture"
        - "Bluetooth Speaker Output"
    - name: "Raspberry Pi 5"
      role: "Main Node"
      services:
        - "Voice Controller"
        - "Home Assistant"
        - "PostgreSQL"
        - "Redis Cache"
        - "Piper TTS"
    - name: "RunPod Cloud"
      role: "GPU Processing"
      services:
        - "Whisper STT (medium.es)"
        - "Mistral-7B LLM"

stack:
  languages:
    - Python 3.11+
  frameworks:
    - FastAPI
    - asyncio
  audio:
    - OpenWakeWord
    - Silero VAD
    - Piper TTS
  ai:
    - Whisper medium.es
    - Mistral-7B-Instruct
  infrastructure:
    - Docker
    - PostgreSQL
    - Redis
  home_automation:
    - Home Assistant
  integrations:
    - Xiaomi miIO
    - Tuya/Smart Life
    - Sony Bravia

targets:
  wake_word_accuracy: ">95%"
  total_latency: "<3s"
  intent_precision: ">90%"
  uptime: ">99%"
  monthly_cost: "<20€"

milestones:
  - version: "0.1.0"
    status: "completed"
    description: "Especificación y arquitectura"
  - version: "1.0.0"
    status: "in_progress"
    description: "MVP con funcionalidad básica"
  - version: "2.0.0"
    status: "planned"
    description: "Multi-room con ESP32"
  - version: "3.0.0"
    status: "planned"
    description: "Memoria conversacional"
  - version: "4.0.0"
    status: "planned"
    description: "Integración Nextcloud + RAG"
