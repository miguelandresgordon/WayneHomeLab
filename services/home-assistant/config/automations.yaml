# Automations for Proyecto Charo
# https://www.home-assistant.io/docs/automation/

# Ejemplo: Registro de comandos de voz de Charo
- id: '1000'
  alias: 'Charo - Log Voice Commands'
  description: 'Registra todos los comandos de voz procesados por Charo'
  trigger:
    - platform: webhook
      webhook_id: charo_voice_command
  action:
    - service: logbook.log
      data:
        name: "Charo Voice Command"
        message: "Comando recibido: {{ trigger.json.command }}"
        entity_id: "{{ trigger.json.entity_id | default('unknown') }}"

# Ejemplo: Apagar luces automáticamente a medianoche
- id: '1001'
  alias: 'Auto - Apagar Luces Medianoche'
  description: 'Apaga todas las luces a las 00:00'
  trigger:
    - platform: time
      at: "00:00:00"
  condition: []
  action:
    - service: light.turn_off
      target:
        entity_id: all
  mode: single

# Ejemplo: Notificar a Charo cuando se enciende la TV
- id: '1002'
  alias: 'Charo - TV Encendida'
  description: 'Notifica cuando la TV Sony se enciende'
  trigger:
    - platform: state
      entity_id: media_player.tv_sony
      to: 'on'
  condition: []
  action:
    - service: notify.charo_notify
      data:
        message: "La TV se ha encendido"
        title: "Evento Smart Home"
  mode: single
