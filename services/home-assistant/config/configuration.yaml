# Home Assistant Configuration for Proyecto Charo
# https://www.home-assistant.io/docs/configuration/

homeassistant:
  name: WayneHome
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  elevation: !secret home_elevation
  unit_system: metric
  time_zone: Europe/Madrid
  country: ES

  # Customization file
  customize: !include customize.yaml

# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Uncomment this if you are using SSL/TLS
# http:
#   ssl_certificate: /ssl/fullchain.pem
#   ssl_key: /ssl/privkey.pem

# Text to speech
tts:
  - platform: google_translate
    language: 'es'

# Webhook for Charo voice commands
webhook:

# Enable API
api:

# Enable History
history:

# Enable Logbook
logbook:

# Enable System Health
system_health:

# Cloud (optional - desactivar si no se usa Nabu Casa)
# cloud:

# Database configuration (PostgreSQL for production)
recorder:
  db_url: !secret db_url
  purge_keep_days: 30
  commit_interval: 1
  exclude:
    domains:
      - automation
      - updater
    entity_globs:
      - sensor.weather_*

# Logger
logger:
  default: info
  logs:
    homeassistant.core: warning
    homeassistant.components.websocket_api: warning

#################################
# SMART LIGHTS CONFIGURATION
#################################

# Xiaomi Smart Bulb (Yeelight)
# Requiere integración Yeelight habilitada en el dispositivo
# En la app Mi Home: Configuración > Red local > Habilitar LAN control
light:
  - platform: yeelight
    devices:
      !secret xiaomi_bulb_ip:
        name: "Luz Xiaomi"
        transition: 1000  # Transición suave de 1 segundo
        use_music_mode: false
        save_on_change: true

# Tuya/Smart Life Integration (Antela Bulbs)
# Requiere configuración de cuenta Tuya Cloud
# Documentación: https://www.home-assistant.io/integrations/tuya/
tuya:
  username: !secret tuya_username
  password: !secret tuya_password
  country_code: "34"  # España
  platform: smart_life

#################################
# MEDIA PLAYER CONFIGURATION
#################################

# Sony Bravia Smart TV
# Requiere habilitar "IP Control" y "Remote Start" en la TV
# Configuración TV: Settings > Network > Home Network > IP Control > Authentication > Normal and Pre-Shared Key
# Generar PSK en la TV para autenticación
media_player:
  - platform: braviatv
    host: !secret sony_tv_ip
    psk: !secret sony_psk
    name: "TV Sony"

    # Fuentes de entrada personalizadas
    source_list:
      - "HDMI 1"
      - "HDMI 2"
      - "HDMI 3/ARC"
      - "Netflix"
      - "YouTube"
      - "Prime Video"

#################################
# AUTOMATION & SCRIPTS
#################################

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

#################################
# CHARO INTEGRATION
#################################

# Webhook para comandos de voz de Charo
# El servicio charo-core enviará comandos a esta URL
# Endpoint: http://<ha_ip>:8123/api/webhook/charo_voice_command
rest_command:
  charo_webhook_response:
    url: !secret charo_webhook_url
    method: POST
    content_type: 'application/json'
    payload: '{{ payload }}'

# Notificaciones para Charo (opcional)
notify:
  - name: charo_notify
    platform: rest
    resource: !secret charo_notify_url
    method: POST
