# Scripts for Proyecto Charo
# https://www.home-assistant.io/docs/scripts/

# Script: Modo cine (apaga luces, enciende TV)
movie_mode:
  alias: "Modo Cine"
  description: "Enciende la TV, apaga las luces y selecciona Netflix"
  sequence:
    - service: light.turn_off
      target:
        entity_id: all
    - service: media_player.turn_on
      target:
        entity_id: media_player.tv_sony
    - delay:
        seconds: 5
    - service: media_player.select_source
      target:
        entity_id: media_player.tv_sony
      data:
        source: "Netflix"

# Script: Buenas noches (apaga todo)
good_night:
  alias: "Buenas Noches"
  description: "Apaga todas las luces y la TV"
  sequence:
    - service: light.turn_off
      target:
        entity_id: all
    - service: media_player.turn_off
      target:
        entity_id: media_player.tv_sony

# Script: Buenos días (enciende luces al 50%)
good_morning:
  alias: "Buenos Días"
  description: "Enciende las luces con brillo medio"
  sequence:
    - service: light.turn_on
      target:
        entity_id: all
      data:
        brightness: 127  # 50% brightness (0-255)

# Script: Ambiente relajante
ambient_mode:
  alias: "Modo Ambiente"
  description: "Luces tenues para relajarse"
  sequence:
    - service: light.turn_on
      target:
        entity_id: all
      data:
        brightness: 50  # ~20% brightness
        kelvin: 2700  # Luz cálida

# Script: Modo trabajo
work_mode:
  alias: "Modo Trabajo"
  description: "Luces brillantes para trabajar"
  sequence:
    - service: light.turn_on
      target:
        entity_id: all
      data:
        brightness: 255  # 100% brightness
        kelvin: 4000  # Luz blanca neutra
