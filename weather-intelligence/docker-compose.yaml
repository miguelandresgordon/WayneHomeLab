# Weather Intelligence Center — local Docker Desktop (Mac)
# No despliega en RPi / Proxmox.
#
#   cd weather-intelligence
#   cp .env.example .env
#   docker compose up --build

name: wic

services:
  wic:
    build:
      context: .
      dockerfile: Dockerfile
    image: wic-local:v1
    container_name: wic-local
    restart: unless-stopped
    ports:
      - "${WIC_PORT:-3000}:3000"
      - "5173:5173"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      WIC_DEMO: ${WIC_DEMO:-1}
      WIC_DB_PATH: /app/data/wic.db
      WIC_PORT: "3000"
    volumes:
      - ./:/app
      - wic_node_modules:/app/node_modules
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "2.0"
        reservations:
          memory: 256M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  wic_node_modules:
